name: Build and publish catalog

on:
  workflow_dispatch:
    inputs:
      release_period:
        description: "Период выпуска YYYY-MM (по умолчанию текущий месяц UTC)"
        required: false
        type: string
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Download previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir previous; then
            cp previous/latest.json latest.json
          fi

      - name: Download official source snapshots
        run: |
          # The Rosstat server currently sends an incomplete TLS chain to Node/OpenSSL.
          # --insecure is deliberately scoped to these public source snapshots; strict
          # schema, coverage, code/unit and price validation still gates publication.
          curl --fail --location --retry 5 --insecure \
            --output rosstat-price.html \
            https://rosstat.gov.ru/statistics/price
          ROSSTAT_URL="$(npx tsx -e "import fs from 'node:fs'; import { discoverRosstatWorkbook } from './src/rosstat.ts'; console.log(discoverRosstatWorkbook(fs.readFileSync('rosstat-price.html','utf8')))")"
          curl --fail --location --retry 5 --insecure \
            --output rosstat-materialy.xlsx \
            "$ROSSTAT_URL"
          curl --fail --location --retry 5 \
            --output emiss-37055.csv.gz \
            https://storage.yandexcloud.net/datalakeiepru-s3-storage-public/fedstatru/csv/37055.csv.gz

      - name: Build package from official sources
        env:
          RELEASE_PERIOD: ${{ inputs.release_period }}
          ROSSTAT_PAGE_FILE: rosstat-price.html
          ROSSTAT_WORKBOOK_FILE: rosstat-materialy.xlsx
          EMISS_CSV_FILE: emiss-37055.csv.gz
        run: |
          set -o pipefail
          if [ -z "$RELEASE_PERIOD" ]; then
            export RELEASE_PERIOD="$(date -u +%Y-%m)"
          fi
          npm run catalog:build | tee catalog-build-summary.json

      - name: Decide whether data changed
        id: changed
        run: |
          NEW_SHA="$(node -p "require('./dist/catalog/latest.json').sha256")"
          OLD_SHA=""
          if [ -f previous/latest.json ]; then
            OLD_SHA="$(node -p "require('./previous/latest.json').sha256")"
          fi
          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Source payload is unchanged; release is skipped."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./dist/catalog/latest.json').catalogVersion")"
          PERIOD="$(node -p "require('./dist/catalog/latest.json').catalogPeriod")"
          ASSET="dist/catalog/catalog-${VERSION}.json.gz"
          gh release create "catalog-${VERSION}" \
            "$ASSET" \
            "dist/catalog/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Каталог ${PERIOD}, ревизия ${VERSION##*-r}" \
            --notes-file catalog-build-summary.json \
            --latest
